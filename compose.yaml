services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment: {POSTGRES_DB: tickets, POSTGRES_USER: tickets, POSTGRES_PASSWORD: tickets}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:8.10.2-alpine
    ports: ["6379:6379"]
  app-1:
    build: .
    environment: &app-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tickets
      SPRING_DATASOURCE_USERNAME: tickets
      SPRING_DATASOURCE_PASSWORD: tickets
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_ADMISSION_MODE: ${ADMISSION_MODE:-redis}
      APP_ADMISSION_FAILUREPOLICY: ${ADMISSION_FAILURE_POLICY:-fail-open}
      APP_ADMISSION_LIMIT: ${ADMISSION_LIMIT:-8}
      APP_ADMISSION_LEASETTL: ${ADMISSION_LEASE_TTL:-2s}
      APP_ADMISSION_HOLDDELAY: ${ADMISSION_HOLD_DELAY:-25ms}
      APP_INSTANCEID: app-1
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8081:8080"]
  app-2:
    build: .
    environment:
      <<: *app-environment
      APP_INSTANCEID: app-2
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8082:8080"]
  k6:
    image: grafana/k6:2.3.0
    profiles: [load]
    working_dir: /scripts
    volumes: ["./load:/scripts:ro"]
    depends_on: [app-1, app-2]
    command: ["run", "ticket-drop.js"]
volumes:
  postgres-data: