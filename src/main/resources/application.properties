spring.application.name=ticket-reservation-api
spring.datasource.url=jdbc:postgresql://localhost:5432/tickets
spring.datasource.username=tickets
spring.datasource.password=tickets
spring.jpa.hibernate.ddl-auto=validate
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=200ms
spring.data.redis.timeout=200ms
app.instance-id=local
app.admission.mode=off
app.admission.failure-policy=fail-open
app.admission.limit=8
app.admission.lease-ttl=2s
app.admission.hold-delay=0ms